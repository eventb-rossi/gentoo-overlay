name: version-check

# Daily upstream version monitor. Mirrors homebrew-tap's release tracker:
#   * "bump" packages (clean single-distfile ${PV} ebuilds) -> open a PR with
#     the new ebuild + regenerated Manifest.
#   * "cargo" packages (cargo-eclass ebuilds) -> regenerate CRATES/LICENSE with
#     pycargoebuild, rebuild the Manifest, build+test, then open a PR. On any
#     failure, fall back to a tracking issue.
#   * "track" packages (opaque/complex) -> open/refresh a tracking issue.
# Detection, classification and Manifest hashing live in
# .github/scripts/version_check.py (no Gentoo/Portage needed: thin manifests).

on:
  schedule:
    - cron: '27 6 * * *'   # daily, 06:27 UTC (safety net + third-party upstreams)
  workflow_dispatch:
  # An eventb-rossi upstream tool just released: scan now instead of waiting for
  # tomorrow's cron (dispatched by eventb-rossi/release-automation).
  repository_dispatch:
    types: [upstream-release]

concurrency:
  group: version-check
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      bump_matrix: ${{ steps.scan.outputs.bump_matrix }}
      cargo_matrix: ${{ steps.scan.outputs.cargo_matrix }}
      tracks: ${{ steps.scan.outputs.tracks }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Scan upstreams
        id: scan
        env:
          GITHUB_TOKEN: ${{ github.token }}   # lifts the GitHub API rate limit
        run: |
          set -euo pipefail
          report=$(python3 .github/scripts/version_check.py check)
          echo "$report" | jq .
          echo "bump_matrix=$(jq -c '[.[] | select(.mode=="bump" and .outdated) | .atom]' <<<"$report")" >> "$GITHUB_OUTPUT"
          echo "cargo_matrix=$(jq -c '[.[] | select(.mode=="cargo" and .outdated) | {atom, current, latest}]' <<<"$report")" >> "$GITHUB_OUTPUT"
          echo "tracks=$(jq -c '[.[] | select(.mode=="track" and .outdated) | {atom, current, latest}]' <<<"$report")" >> "$GITHUB_OUTPUT"
          # Surface detection failures (network/parse) without failing the run.
          jq -r '.[] | select(.error != null) | "⚠️ \(.atom): \(.error)"' <<<"$report" >> "$GITHUB_STEP_SUMMARY" || true

  # One PR per outdated bumpable package.
  bump:
    needs: detect
    if: needs.detect.outputs.bump_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        atom: ${{ fromJSON(needs.detect.outputs.bump_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bump ${{ matrix.atom }}
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/version_check.py bump '${{ matrix.atom }}'
      - name: Open pull request
        if: steps.bump.outputs.bumped == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # A PAT lets the bump PR trigger the pkgcheck workflow (the default
          # github.token cannot). Uses the org secret VERSION_BUMP_TOKEN (Contents +
          # Pull requests: write), shared across the eventb-rossi packaging repos;
          # falls back to github.token (PR still opens, just doesn't re-trigger CI).
          token: ${{ secrets.VERSION_BUMP_TOKEN || github.token }}
          branch: version-bump/${{ steps.bump.outputs.pn }}-${{ steps.bump.outputs.new }}
          delete-branch: true
          title: '${{ matrix.atom }}: ${{ steps.bump.outputs.old }} → ${{ steps.bump.outputs.new }}'
          commit-message: |
            ${{ matrix.atom }}: add ${{ steps.bump.outputs.new }}

            Automated version bump by the version-check workflow.

            Signed-off-by: Denis Efremov <efremov@linux.com>
          labels: version-bump
          body: |
            Automated version bump detected by the daily `version-check` workflow.

            | | Version |
            |---|---|
            | Packaged | `${{ steps.bump.outputs.old }}` |
            | Upstream | `${{ steps.bump.outputs.new }}` |

            The new ebuild is copied verbatim from the previous version (the
            version is taken from the filename) and the thin `Manifest` is
            regenerated from the freshly downloaded distfile(s).

            Review checklist:
            - [ ] Build/install still works (`SRC_URI`, deps, install phases unchanged)
            - [ ] Drop the superseded version if appropriate
            - [ ] `pkgcheck` is green

  # One PR per outdated cargo package: pycargoebuild regenerates CRATES/LICENSE
  # and the Manifest, the result is built + tested, then a PR is opened. Any
  # failure (regen, build, or tests) falls back to a tracking issue, so a
  # release is never silently dropped.
  bump-cargo:
    needs: detect
    if: needs.detect.outputs.cargo_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.detect.outputs.cargo_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pycargoebuild
        run: pip install pycargoebuild
      - name: Bump ${{ matrix.pkg.atom }}
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/version_check.py bump-cargo '${{ matrix.pkg.atom }}'
      - name: Build & test the regenerated package
        if: steps.bump.outputs.bumped == 'true'
        id: verify
        working-directory: ${{ steps.bump.outputs.srcdir }}
        env:
          SKIP_TESTS: ${{ steps.bump.outputs.skip_tests }}
          BINS: ${{ steps.bump.outputs.bins }}
        run: |
          set -euo pipefail
          cargo build --release --locked
          # The ebuild's src_install dobin's these by name; a renamed upstream
          # binary builds fine but would die in Portage's install phase. Fail
          # here so the PR is never opened claiming a broken install works.
          for b in $BINS; do
            test -x "target/release/$b" || {
              echo "::error::ebuild installs '$b' but target/release/$b is missing (renamed upstream binary?)"
              exit 1
            }
          done
          # The GitHub archive tarball omits git submodules (the editor
          # tree-sitter grammar), so the ebuild's CARGO_SKIP_TESTS guard tests
          # that read it; skip the same names here.
          args=()
          for t in $SKIP_TESTS; do args+=(--skip "$t"); done
          cargo test --release --locked -- "${args[@]}"
      - name: Open pull request
        id: pr
        if: steps.bump.outputs.bumped == 'true' && steps.verify.outcome == 'success'
        uses: peter-evans/create-pull-request@v8
        with:
          # See the bump job: a PAT lets the PR re-trigger pkgcheck.
          token: ${{ secrets.VERSION_BUMP_TOKEN || github.token }}
          branch: version-bump/${{ steps.bump.outputs.pn }}-${{ steps.bump.outputs.new }}
          delete-branch: true
          title: '${{ matrix.pkg.atom }}: ${{ steps.bump.outputs.old }} → ${{ steps.bump.outputs.new }}'
          commit-message: |
            ${{ matrix.pkg.atom }}: add ${{ steps.bump.outputs.new }}, drop ${{ steps.bump.outputs.old }}

            Regenerated CRATES/LICENSE with pycargoebuild and rebuilt the Manifest.
            Automated version bump by the version-check workflow.

            Signed-off-by: Denis Efremov <efremov@linux.com>
          labels: version-bump
          body: |
            Automated cargo version bump detected by the daily `version-check` workflow.

            | | Version |
            |---|---|
            | Packaged | `${{ steps.bump.outputs.old }}` |
            | Upstream | `${{ steps.bump.outputs.new }}` |

            `pycargoebuild` regenerated the `CRATES`/`LICENSE` blocks from the new
            `Cargo.lock`, the thin `Manifest` was rebuilt from the app tarball and
            every crate distfile, and the previous version was dropped. The result
            was **built and tested** in CI (`cargo build --release --locked` +
            `cargo test` with the ebuild's `CARGO_SKIP_TESTS`).

            Review checklist:
            - [ ] Diff is only `CRATES`/`LICENSE`/the pycargoebuild comment
            - [ ] `src_install`/deps still appropriate for the new release
            - [ ] `pkgcheck` is green
      - name: Fall back to a tracking issue
        if: failure() && (steps.bump.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.pr.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          ATOM: ${{ matrix.pkg.atom }}
          CURRENT: ${{ matrix.pkg.current }}
          LATEST: ${{ matrix.pkg.latest }}
        run: |
          set -euo pipefail
          gh label create version-bump --repo "$GITHUB_REPOSITORY" \
            --color FBCA04 --description "Upstream release detected by version-check" 2>/dev/null || true
          pn=${ATOM##*/}
          title="${pn}: ${CURRENT} → ${LATEST}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label version-bump \
            --state open --json number,title --limit 200)
          if jq -e --arg t "$title" 'any(.[]; .title == $t)' <<<"$existing" >/dev/null; then
            echo "Already tracked: $title"
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(printf '%s\n' \
            "The automated cargo bump for \`${ATOM}\` (\`${CURRENT}\` → \`${LATEST}\`) failed in CI, so it needs a manual version bump:" \
            "" \
            "- [ ] Regenerate the ebuild (\`pycargoebuild\`) and the \`Manifest\`" \
            "- [ ] Build + test the new version" \
            "- [ ] \`pkgcheck scan\` is green" \
            "" \
            "Failed run: ${run_url}" \
            "" \
            "_Opened automatically by the version-check workflow after an auto-bump failure._")
          new_url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$title" --label version-bump --body "$body")
          new_num="${new_url##*/}"
          # Supersede older open issues for the same package (best-effort), as
          # the track job does — otherwise stale version targets accumulate.
          while read -r num; do
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by #${new_num} (${title})." || true
          done < <(jq -r --arg p "${pn}: " '.[] | select(.title | startswith($p)) | .number' <<<"$existing")

  # One tracking issue per outdated package that can't be auto-bumped.
  track:
    needs: detect
    if: needs.detect.outputs.tracks != '[]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TRACKS: ${{ needs.detect.outputs.tracks }}
    steps:
      - name: File / refresh tracking issues
        run: |
          set -euo pipefail
          gh label create version-bump --repo "$GITHUB_REPOSITORY" \
            --color FBCA04 --description "Upstream release detected by version-check" 2>/dev/null || true

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label version-bump \
            --state open --json number,title --limit 200)"

          # Loop in the parent shell (process substitution, not a pipe) and treat
          # every gh call as best-effort, so one package's API failure doesn't
          # abort the batch under `set -e` and leave the rest untracked.
          while IFS=$'\t' read -r atom current latest; do
            pn=${atom##*/}
            title="${pn}: ${current} → ${latest}"

            if jq -e --arg t "$title" 'any(.[]; .title == $t)' <<<"$existing" >/dev/null; then
              echo "Already tracked: $title"
              continue
            fi

            body="$(cat <<EOF
          A newer upstream release of **\`${atom}\`** was detected.

          | | Version |
          |---|---|
          | Packaged | \`${current}\` |
          | Upstream | \`${latest}\` |

          This package isn't auto-bumped (opaque build id, vendored archives, or
          detached signatures), so it needs a manual version bump:

          - [ ] Add the \`${latest}\` ebuild and update \`SRC_URI\`
          - [ ] Regenerate the \`Manifest\`
          - [ ] \`pkgcheck scan\` is green

          _Opened automatically by the daily version-check workflow._
          EOF
          )"

            echo "Filing issue: $title"
            if ! new_url="$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --label version-bump --body "$body")"; then
              echo "::warning::failed to file tracking issue for ${atom}"
              continue
            fi
            new_num="${new_url##*/}"

            # Supersede older open issues for the same package (best-effort).
            while read -r num; do
              gh issue close "$num" --repo "$GITHUB_REPOSITORY" \
                --comment "Superseded by #${new_num} (${title})." || true
            done < <(jq -r --arg p "${pn}: " '.[] | select(.title | startswith($p)) | .number' <<<"$existing")
          done < <(jq -r '.[] | [.atom, .current, .latest] | @tsv' <<<"$TRACKS")
